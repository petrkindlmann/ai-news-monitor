          - heading "Automated Alignment Is Harder Than You Think" [level=3] [ref=e50]:
            - link "Automated Alignment Is Harder Than You Think" [ref=e51] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.06390
          - paragraph [ref=e52]: The paper argues that using AI agents to automate alignment research—a leading ASI safety proposal—could produce compelling but catastrophically misleading safety assessments even without scheming. The failure mode isn't malice; it's subtle systematic error that looks like success.
          - paragraph [ref=e53]:
            - strong [ref=e54]: "Why it matters:"
            - text: If the field's main plan for aligning superintelligence has a structural flaw, that's worth knowing now.
          - paragraph [ref=e55]:
            - strong [ref=e56]: "Takeaway:"
            - text: Don't assume AI-assisted alignment research is safe by default. The evaluation problem is recursive.
