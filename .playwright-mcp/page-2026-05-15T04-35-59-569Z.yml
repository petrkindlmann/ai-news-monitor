          - 'heading "History Anchors: Prior Behavior Steers LLMs Toward Unsafe Actions" [level=3] [ref=e64]':
            - 'link "History Anchors: Prior Behavior Steers LLMs Toward Unsafe Actions" [ref=e65] [cursor=pointer]':
              - /url: https://arxiv.org/abs/2605.13825
          - paragraph [ref=e66]: Conversation history can be used to gradually steer LLM agents toward unsafe decisions—a behavioral anchoring attack that doesn't require prompt injection. Prior compliant behavior makes later unsafe requests more likely to succeed. Multi-turn agent deployments are specifically vulnerable.
          - paragraph [ref=e67]:
            - strong [ref=e68]: "Why it matters:"
            - text: Session-level attack vectors are underappreciated. Stateful agents have a larger attack surface than stateless ones.
          - paragraph [ref=e69]:
            - strong [ref=e70]: "Takeaway:"
            - text: Implement session-level safety checks, not just per-turn filtering. History is an attack vector.
