          - heading "AgentLens Exposes the 'Lucky Pass' Problem in SWE-Agent Evaluation" [level=3] [ref=e78]:
            - link "AgentLens Exposes the 'Lucky Pass' Problem in SWE-Agent Evaluation" [ref=e79] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.12925
          - paragraph [ref=e80]: AgentLens finds that SWE agents frequently pass benchmarks through coincidental solutions rather than sound reasoning—the 'lucky pass' problem. Binary pass/fail metrics hide this. Process-level trajectory analysis reveals agents that look capable but aren't.
          - paragraph [ref=e81]:
            - strong [ref=e82]: "Why it matters:"
            - text: If your SWE agent eval is just pass/fail, you're measuring luck as much as capability.
          - paragraph [ref=e83]:
            - strong [ref=e84]: "Takeaway:"
            - text: Instrument agent trajectories, not just outcomes. A correct answer from wrong reasoning will fail in production.
