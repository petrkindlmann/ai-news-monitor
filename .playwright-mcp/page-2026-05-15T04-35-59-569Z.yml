          - heading "GRACE Curates Reasoning Training Data Step-by-Step, Not Sample-by-Sample" [level=3] [ref=e95]:
            - link "GRACE Curates Reasoning Training Data Step-by-Step, Not Sample-by-Sample" [ref=e96] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.13130
          - paragraph [ref=e97]: "GRACE uses gradient alignment to score individual reasoning steps rather than whole samples. Steps within a trace contribute unevenly to learning—most curation pipelines ignore this. The result: better post-training efficiency with less data."
          - paragraph [ref=e98]:
            - strong [ref=e99]: "Why it matters:"
            - text: If you're doing reasoning fine-tuning, your data curation pipeline is probably leaving quality on the table.
          - paragraph [ref=e100]:
            - strong [ref=e101]: "Takeaway:"
            - text: Step-level curation beats sample-level filtering for reasoning tasks. Worth implementing before your next training run.
