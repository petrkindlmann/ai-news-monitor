          - paragraph [ref=e139]: A systematic evaluation of prompt injection defenses finds current approaches remain inadequate under adversarial conditions. No defense tested provides robust protection across attack variants. Defense-in-depth is the only viable posture.
          - paragraph [ref=e140]:
            - strong [ref=e141]: "Why it matters:"
