        - generic [ref=e9]: Issue 2026 · Week 20 · May 8 – May 15, 2026
        - heading "Attack Surface, Alignment Gaps, and the Benchmark Flood" [level=1] [ref=e10]
        - generic [ref=e11]: "Two themes dominated this week and neither is comfortable. First: agent security is worse than most teams are treating it. One in seven agent skill files carries hardcoded credentials with DB write access. That's not a theoretical attack surface—that's production exposure sitting in repos right now. Pair that with new research on behavioral steering via conversation history and prompt injection defenses that still don't hold, and you have a serious pre-deployment checklist problem. Second: the benchmark ecosystem is eating itself. This week alone produced benchmarks for Olympiad reasoning, SWE agents, mobile GUI agents, SRE tasks, supply chain management, ICU data, and agentic RL post-training. Most of them are fine papers. But the signal-to-noise ratio on 'our model achieves SOTA on X' claims is approaching zero when X changes every week. AgentLens calling out the 'lucky pass' problem in SWE-agent evaluation is the most honest thing published this week. OpenAI's TanStack supply chain response is worth reading for the operational detail, not the PR framing. And the argument that automated alignment for superintelligence is harder than the field assumes deserves more attention than it's getting. Benchmark fatigue is real. Security debt is real. Read accordingly."
