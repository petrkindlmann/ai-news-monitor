          - heading "Reasoning Models Do Long Chain-of-Thought but Plan Myopically" [level=3] [ref=e109]:
            - link "Reasoning Models Do Long Chain-of-Thought but Plan Myopically" [ref=e110] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2605.06840
          - paragraph [ref=e111]: Extracting search trees from LLM reasoning traces shows that despite extended deliberation, models plan myopically—they don't actually look far ahead. The appearance of strategic reasoning in CoT doesn't mean genuine long-horizon planning is happening.
          - paragraph [ref=e112]:
            - strong [ref=e113]: "Why it matters:"
            - text: Prompting strategies that assume deep planning may be working for the wrong reasons.
          - paragraph [ref=e114]:
            - strong [ref=e115]: "Takeaway:"
            - text: Don't trust CoT length as a proxy for planning depth. Test on tasks that actually require multi-step lookahead.
